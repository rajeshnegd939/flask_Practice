name: CI/CD

on:
  push:
    branches: [main, staging]
    tags: ["v*"]            # a release tag deploys to production
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-dependencies:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > installed-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installed-packages
          path: installed-packages.txt

  run-tests:
    name: Run tests
    needs: install-dependencies
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      SECRET_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/junit.xml

  build:
    name: Build
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image (same Dockerfile the servers use)
        run: docker build -t flask-practice:${GITHUB_SHA::8} .
      - name: Package the release
        run: |
          git archive --format=tar.gz -o release.tar.gz HEAD
          ls -lh release.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy-production:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
    permissions:
      contents: read
      id-token: write
