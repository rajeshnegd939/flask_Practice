name: Deploy

# Reusable workflow, called by ci-cd.yml for staging and production.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # needed for the OIDC login to AWS

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      AWS_REGION: ap-south-1
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', inputs.environment, github.run_number) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Add the app secret to the release
        run: |
          mkdir -p bundle && tar -xzf release.tar.gz -C bundle
          echo "SECRET_KEY=${{ secrets.APP_SECRET_KEY }}" > bundle/app.env
          tar -czf release.tar.gz -C bundle .

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload release to S3
        run: aws s3 cp release.tar.gz "s3://${{ secrets.DEPLOY_BUCKET }}/releases/$VERSION.tar.gz"

      - name: Deploy on the server through SSM
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "github run ${{ github.run_id }}" \
            --parameters commands="aws s3 cp s3://$BUCKET/releases/$VERSION.tar.gz /tmp/release.tar.gz,mkdir -p /tmp/rel-$VERSION,tar -xzf /tmp/release.tar.gz -C /tmp/rel-$VERSION,bash /tmp/rel-$VERSION/deploy/remote-deploy.sh /tmp/release.tar.gz $VERSION ${{ inputs.environment }}" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "SSM status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.APP_URL }}/health"
          echo
          curl -fsS -o /dev/null -w "home page: HTTP %{http_code}\n" "${{ vars.APP_URL }}/"
